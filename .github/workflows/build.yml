# 构建 KavitaInk APK
#
# - 推送到 main / 提交 PR / 手动触发：跑单元测试 + 打包 release APK，作为构建产物（Artifacts）上传
# - 推送 v* 标签（如 v1.2.0）：额外创建 GitHub Release，并附上 APK
#
# 签名：在仓库 Settings → Secrets and variables → Actions 中配置
#   KEYSTORE_BASE64   签名密钥库（release.jks）的 base64
#   KEYSTORE_PASSWORD 密钥库密码
#   KEY_ALIAS         密钥别名（kavitaink）
#   KEY_PASSWORD      密钥密码
# 未配置时（例如来自 fork 的 PR）会退回调试签名，APK 仍可安装，但不能覆盖安装正式版。
# 推送 v* 标签发版时必须配置签名，否则直接失败，避免发布调试签名的版本。

name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 推送标签时创建 Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        run: |
          base=$(grep -oP 'val baseVersionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${base}-$(git rev-parse --short HEAD)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "版本：$name"

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KAVITAINK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "已载入发布签名"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::发布版本必须配置签名 Secrets（KEYSTORE_BASE64 等），见 README「自动构建」一节"
              exit 1
            fi
            echo "suffix=-debugsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名 Secrets，APK 将使用调试签名（不能覆盖安装正式版）"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          KAVITAINK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KAVITAINK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KAVITAINK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionName="${{ steps.version.outputs.name }}" --console=plain

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          apk="out/KavitaInk-${{ steps.version.outputs.name }}${{ steps.signing.outputs.suffix }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "$apk" | grep -E "DN|SHA-256"
          "$bt/aapt2" dump badging "$apk" | head -1
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KavitaInk-${{ steps.version.outputs.name }}${{ steps.signing.outputs.suffix }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "KavitaInk $GITHUB_REF_NAME" --generate-notes
